# INDIGO X DENIM LAB (the lab branch; main is the original line): build Melodee for the MPC Sample exactly as ./build.sh does,
# on a native arm64 runner (Melodee's build image is linux/arm64), then package
# the SD card zip and keep the binary, previews and zip as artifacts.
name: build
on:
  push:
    branches: [lab]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build, test, sound self-test, monkey test and page previews
        run: MELODEE_VERSION=v0.6.3-lab ./build.sh
      - name: Boot animation frames
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/work" melodee-builder \
            sh -c 'mkdir -p build/boot && build/melodee --melodee-boot build/boot'
      - name: Strip and self-test the release binary
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/work" sample-base-builder \
            sh -c 'strip -o build/melodee.release build/melodee && build/melodee.release --self-test build/release-test.wav'
      - name: SD card zip
        run: |
          python3 tools/make_release.py v0.6.3-lab --allow-dirty
      - name: Give the runner the files the build container wrote
        run: sudo chown -R "$(id -u):$(id -g)" build dist
      - name: Keep the build on the builds branch
        run: |
          rm -rf /tmp/out && mkdir -p /tmp/out/previews
          cp dist/* /tmp/out/
          cp build/melodee-preview/*.png /tmp/out/previews/ 2>/dev/null || true
          mkdir -p /tmp/out/boot && cp build/boot/boot-0[0-9]0.png /tmp/out/boot/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b builds-lab
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Build of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})" > BUILD.txt
          git add -A && git commit -qm "build ${GITHUB_SHA::12}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" builds-lab
      - uses: actions/upload-artifact@v4
        with:
          name: indigo-x-denim-lab-build
          path: |
            build/melodee
            build/melodee.release
            build/test.wav
            build/melodee-preview/
            dist/
          if-no-files-found: warn
