# INDIGO X DENIM: a crash hunt, on the debug branch only.
name: debug
on:
  push:
    branches: [debug]
jobs:
  debug:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build only
        run: |
          python3 tools/dependencies.py
          docker build --platform linux/arm64 -t sample-base-builder base/tools
          docker build --platform linux/arm64 -t melodee-builder tools/plugin_support
          docker run --rm --platform linux/arm64 -v "$PWD:/work" melodee-builder sh -c 'make -j4'
      - name: Previews under gdb
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD:/work" melodee-builder sh -c '
            apt-get update -qq && apt-get install -y -qq gdb > /dev/null
            mkdir -p /tmp/p
            gdb -batch -ex run -ex bt -ex "info registers pc" --args build/melodee --melodee-preview /tmp/p 2>&1 | tail -60
          '
